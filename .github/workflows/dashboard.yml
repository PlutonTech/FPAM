# Dashboard (react/) checks: lint, tests, type-check and a full build on every
# push / pull request that touches react/. A red ✗ on the commit means
# something is broken. (app/ itself is still built locally with
# `npm run build:embed` and committed — CI doesn't commit, because builds on
# Linux and Windows name files differently and would create a commit every push.)
name: Dashboard
on:
  push:
    paths: ['react/**', '.github/workflows/dashboard.yml']
  pull_request:
    paths: ['react/**']
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
