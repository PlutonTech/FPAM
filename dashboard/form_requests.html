<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Form Requests — FPAMAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="css/main.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy: #0B2545; --blue: #4A90D9; --blue-lt: #6AAEE8; --blue-bg: rgba(74,144,217,.08);
  --bg: #F4F6F9; --card: #ffffff; --border: #E8ECF0;
  --text: #0B1829; --text2: #2C3E50; --text3: #5A6A7A;
  --danger: #e05555; --warn: #f0a500; --success: #2DB87B;
  --sidebar-w: 250px; --font: 'DM Sans', sans-serif;
}
body { font-family: var(--font); background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; font-size: 14px; line-height: 1.5; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-thumb { background: #d0d8e4; border-radius: 10px; }

/* NOTE: this sidebar block should be reconciled with your current live
   sidebar markup — built to match the established pattern, not copied from
   a verified-current source for this specific page. */
#sidebar { width: var(--sidebar-w); background: var(--navy); color: #fff; display: flex; flex-direction: column; flex-shrink: 0; }
.logo { padding: 22px 20px 18px; border-bottom: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; gap: 12px; }
.logo-icon { width: 38px; height: 38px; border-radius: 10px; background: var(--blue); display: flex; align-items: center; justify-content: center; }
.logo-mark { font-size: 17px; font-weight: 800; color: #fff; line-height: 1.1; }
.logo-sub { font-size: 9px; color: rgba(255,255,255,.45); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 2px; }
.sidebar-nav { flex: 1; overflow-y: auto; padding: 10px 0; }
.nav-item { display: flex; align-items: center; gap: 11px; padding: 10px 20px; color: rgba(255,255,255,.65); text-decoration: none; font-size: 13px; font-weight: 500; }
.nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav-item.active { background: rgba(74,144,217,.16); color: #fff; border-right: 3px solid var(--blue); }

main { flex: 1; overflow-y: auto; padding: 28px 32px; }
.page-hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; flex-wrap: wrap; gap: 12px; }
.page-hd h1 { font-size: 22px; font-weight: 800; }
.page-hd p { font-size: 13px; color: var(--text3); margin-top: 3px; }

.btn { display: inline-flex; align-items: center; gap: 7px; padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: .15s; }
.btn-primary { background: var(--blue); color: #fff; } .btn-primary:hover { background: var(--blue-lt); }
.btn-secondary { background: #fff; color: var(--text2); border: 1px solid var(--border); }
.btn-ghost { background: none; color: var(--text3); }
.btn-success { background: var(--success); color: #fff; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-xs { padding: 5px 10px; font-size: 11px; }

.filter-bar { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
.filter-bar select, .filter-bar input { border: 1px solid var(--border); border-radius: 7px; padding: 8px 12px; font-size: 12.5px; font-family: var(--font); }

.card { background: var(--card); border-radius: 12px; border: 1px solid var(--border); }
.req-row { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-bottom: 1px solid var(--border); cursor: pointer; }
.req-row:last-child { border-bottom: none; }
.req-row:hover { background: var(--blue-bg); }
.req-icon { width: 38px; height: 38px; border-radius: 9px; background: var(--blue-bg); color: var(--blue); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.req-title { font-size: 13px; font-weight: 700; color: var(--navy); }
.req-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }
.req-meta { margin-left: auto; display: flex; align-items: center; gap: 10px; }

.tag { font-size: 10.5px; font-weight: 700; padding: 4px 11px; border-radius: 20px; white-space: nowrap; }
.tag-gray { background: #EEF1F5; color: var(--text3); }
.tag-blue { background: var(--blue-bg); color: var(--blue); }
.tag-green { background: rgba(45,184,123,.12); color: var(--success); }
.tag-red { background: rgba(224,85,85,.12); color: var(--danger); }
.tag-warn { background: rgba(240,165,0,.12); color: var(--warn); }

.empty-state { text-align: center; padding: 60px 20px; color: var(--text3); }
.empty-state i { font-size: 34px; margin-bottom: 14px; opacity: .4; }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.open { display: flex; }
.modal-box { background: #fff; border-radius: 14px; width: 800px; max-width: 100%; max-height: 90vh; display: flex; flex-direction: column; }
.modal-hd { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.modal-hd h3 { font-size: 16px; font-weight: 800; }
.modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }
.modal-ft { padding: 14px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.close-x { background: none; border: none; font-size: 18px; color: var(--text3); cursor: pointer; }

.form-type-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(220px,1fr)); gap: 10px; }
.form-type-card { border: 1px solid var(--border); border-radius: 10px; padding: 14px; cursor: pointer; }
.form-type-card:hover { border-color: var(--blue); background: var(--blue-bg); }
.form-type-card i { color: var(--blue); font-size: 16px; margin-bottom: 8px; display: block; }
.form-type-card div { font-size: 12.5px; font-weight: 600; color: var(--navy); }

.ff-field { margin-bottom: 14px; }
.ff-field-wide { grid-column: 1/-1; }
.ff-label { display: block; font-size: 11.5px; font-weight: 600; color: var(--text3); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .3px; }
.ff-input { width: 100%; border: 1px solid var(--border); border-radius: 7px; padding: 9px 11px; font-size: 13px; font-family: var(--font); color: var(--text); }
.ff-checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text2); padding: 6px 0; }
.ff-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
.ff-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 4px; }
.ff-table th { text-align: left; font-size: 10px; text-transform: uppercase; color: var(--text3); padding: 6px 8px; border-bottom: 2px solid var(--border); }
.ff-table td { padding: 4px 6px; border-bottom: 1px solid var(--border); }

.review-panel { background: var(--bg); border-radius: 10px; padding: 16px; margin-top: 20px; }
.review-panel h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--text3); margin-bottom: 12px; }

.spinner { width: 26px; height: 26px; border: 3px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="sidebar">
  <div class="logo">
    <div class="logo-icon"><i class="fa-solid fa-map-location-dot" style="color:#fff"></i></div>
    <div><div class="logo-mark">FPAMAS</div><div class="logo-sub">FPAM Platform</div></div>
  </div>
  <div class="sidebar-nav">
    <a class="nav-item" href="dashboard.html"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
    <a class="nav-item" href="assets.html"><i class="fa-solid fa-database"></i> Asset Registry</a>
    <a class="nav-item" href="me.html"><i class="fa-solid fa-chart-line"></i> M&amp;E Reports</a>
    <a class="nav-item active" href="form_requests.html" data-require-role="System Admin,Supervisor,Sub-Head,GIS Analyst"><i class="fa-solid fa-file-circle-check"></i> Form Requests</a>
    <a class="nav-item" href="users.html"><i class="fa-solid fa-users"></i> Users</a>
  </div>
</div>

<main>
  <div class="page-hd">
    <div>
      <h1>Form Requests</h1>
      <p>Compliance forms submitted by MDAs, plus requests you create on their behalf</p>
    </div>
    <button class="btn btn-primary" id="new-request-btn" onclick="openNewRequestPicker()"><i class="fa-solid fa-plus"></i> New Request</button>
  </div>

  <div class="filter-bar">
    <select id="filter-mda" onchange="loadRequests()"><option value="">All MDAs</option></select>
    <select id="filter-status" onchange="loadRequests()">
      <option value="">All Statuses</option>
      <option value="Submitted">Submitted</option>
      <option value="UnderReview">Under Review</option>
      <option value="Approved">Approved</option>
      <option value="Deferred">Deferred</option>
      <option value="Rejected">Rejected</option>
      <option value="Draft">Draft</option>
    </select>
    <select id="filter-form-type" onchange="loadRequests()"><option value="">All Form Types</option></select>
  </div>

  <div class="card" id="requests-list">
    <div style="text-align:center;padding:50px"><div class="spinner"></div></div>
  </div>
</main>

<!-- FORM TYPE PICKER -->
<div class="modal-overlay" id="picker-modal">
  <div class="modal-box" style="width:640px">
    <div class="modal-hd"><h3>Select a Form</h3><button class="close-x" onclick="closeModal('picker-modal')"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="modal-body"><div class="form-type-grid" id="form-type-grid"></div></div>
  </div>
</div>

<!-- NEW REQUEST (on behalf of any MDA) -->
<div class="modal-overlay" id="new-request-modal">
  <div class="modal-box">
    <div class="modal-hd"><h3 id="nr-title">New Request</h3><button class="close-x" onclick="closeModal('new-request-modal')"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="modal-body">
      <div class="ff-field">
        <label class="ff-label">MDA</label>
        <select class="ff-input" id="nr-mda"></select>
      </div>
      <div class="ff-form-grid" id="nr-fields"></div>
    </div>
    <div class="modal-ft">
      <button class="btn btn-ghost" onclick="closeModal('new-request-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="submitNewRequest()"><i class="fa-solid fa-paper-plane"></i> Submit</button>
    </div>
  </div>
</div>

<!-- REVIEW MODAL -->
<div class="modal-overlay" id="review-modal">
  <div class="modal-box">
    <div class="modal-hd"><h3 id="rv-title">Review Request</h3><button class="close-x" onclick="closeModal('review-modal')"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="modal-body">
      <div id="rv-form-fields" class="ff-form-grid"></div>
      <div class="review-panel">
        <h4>FPAM Review</h4>
        <div class="ff-field">
          <label class="ff-label">Remarks</label>
          <textarea class="ff-input" id="rv-remarks" rows="3"></textarea>
        </div>
      </div>
    </div>
    <div class="modal-ft" id="rv-footer"></div>
  </div>
</div>

<script src="js/form_field_defs.js"></script>
<script src="js/form_renderer.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/form_requests.js"></script>
</body>
</html>
