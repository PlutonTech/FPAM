<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MDA Portal — FPAM FPAMAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy: #0B2545; --blue: #4A90D9; --blue-lt: #6AAEE8; --blue-bg: rgba(74,144,217,.08);
  --bg: #F4F6F9; --card: #ffffff; --border: #E8ECF0;
  --text: #0B1829; --text2: #2C3E50; --text3: #5A6A7A;
  --danger: #e05555; --warn: #f0a500; --success: #2DB87B;
  --font: 'DM Sans', sans-serif;
}
body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; min-height: 100vh; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-thumb { background: #d0d8e4; border-radius: 10px; }

header { background: var(--navy); color: #fff; padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
.hdr-left { display: flex; align-items: center; gap: 12px; }
.hdr-logo { width: 36px; height: 36px; border-radius: 9px; background: var(--blue); display: flex; align-items: center; justify-content: center; }
.hdr-title { font-size: 15px; font-weight: 800; }
.hdr-sub { font-size: 10px; color: rgba(255,255,255,.5); letter-spacing: 1px; text-transform: uppercase; margin-top: 1px; }
.hdr-right { display: flex; align-items: center; gap: 14px; font-size: 12px; }
.hdr-mda { background: rgba(255,255,255,.08); padding: 6px 14px; border-radius: 20px; font-weight: 600; }
.logout-btn { background: none; border: 1px solid rgba(255,255,255,.25); color: #fff; padding: 7px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; }

.wrap { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }
.page-hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; flex-wrap: wrap; gap: 12px; }
.page-hd h1 { font-size: 22px; font-weight: 800; }
.page-hd p { font-size: 13px; color: var(--text3); margin-top: 3px; }

.btn { display: inline-flex; align-items: center; gap: 7px; padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: .15s; }
.btn-primary { background: var(--blue); color: #fff; } .btn-primary:hover { background: var(--blue-lt); }
.btn-secondary { background: #fff; color: var(--text2); border: 1px solid var(--border); }
.btn-ghost { background: none; color: var(--text3); }
.btn-xs { padding: 5px 10px; font-size: 11px; }

.stat-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 24px; }
.stat-card { background: var(--card); border-radius: 12px; padding: 16px 18px; border: 1px solid var(--border); }
.stat-n { font-size: 24px; font-weight: 800; color: var(--navy); }
.stat-l { font-size: 11px; color: var(--text3); margin-top: 2px; }

.card { background: var(--card); border-radius: 12px; border: 1px solid var(--border); }
.req-row { display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-bottom: 1px solid var(--border); cursor: pointer; transition: .15s; }
.req-row:last-child { border-bottom: none; }
.req-row:hover { background: var(--blue-bg); }
.req-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--blue-bg); color: var(--blue); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.req-title { font-size: 13.5px; font-weight: 700; color: var(--navy); }
.req-sub { font-size: 11.5px; color: var(--text3); margin-top: 2px; }
.req-meta { margin-left: auto; display: flex; align-items: center; gap: 12px; }

.tag { font-size: 10.5px; font-weight: 700; padding: 4px 11px; border-radius: 20px; white-space: nowrap; }
.tag-gray { background: #EEF1F5; color: var(--text3); }
.tag-blue { background: var(--blue-bg); color: var(--blue); }
.tag-green { background: rgba(45,184,123,.12); color: var(--success); }
.tag-red { background: rgba(224,85,85,.12); color: var(--danger); }
.tag-warn { background: rgba(240,165,0,.12); color: var(--warn); }

.empty-state { text-align: center; padding: 60px 20px; color: var(--text3); }
.empty-state i { font-size: 34px; margin-bottom: 14px; opacity: .4; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.open { display: flex; }
.modal-box { background: #fff; border-radius: 14px; width: 760px; max-width: 100%; max-height: 90vh; display: flex; flex-direction: column; }
.modal-hd { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.modal-hd h3 { font-size: 16px; font-weight: 800; }
.modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }
.modal-ft { padding: 14px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
.close-x { background: none; border: none; font-size: 18px; color: var(--text3); cursor: pointer; }

.form-type-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(220px,1fr)); gap: 10px; }
.form-type-card { border: 1px solid var(--border); border-radius: 10px; padding: 14px; cursor: pointer; transition: .15s; }
.form-type-card:hover { border-color: var(--blue); background: var(--blue-bg); }
.form-type-card i { color: var(--blue); font-size: 16px; margin-bottom: 8px; display: block; }
.form-type-card div { font-size: 12.5px; font-weight: 600; color: var(--navy); line-height: 1.35; }

/* Dynamic form field styles (used by form_renderer.js) */
.ff-field { margin-bottom: 14px; }
.ff-field-wide { grid-column: 1/-1; }
.ff-label { display: block; font-size: 11.5px; font-weight: 600; color: var(--text3); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .3px; }
.ff-input { width: 100%; border: 1px solid var(--border); border-radius: 7px; padding: 9px 11px; font-size: 13px; font-family: var(--font); color: var(--text); }
.ff-input:focus { outline: none; border-color: var(--blue); }
.ff-checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text2); padding: 6px 0; }
.ff-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
.ff-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 4px; }
.ff-table th { text-align: left; font-size: 10px; text-transform: uppercase; color: var(--text3); padding: 6px 8px; border-bottom: 2px solid var(--border); }
.ff-table td { padding: 4px 6px; border-bottom: 1px solid var(--border); }
.ff-table .ff-input { padding: 6px 8px; font-size: 12px; }

.spinner { width: 26px; height: 26px; border: 3px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="hdr-left">
    <div class="hdr-logo"><i class="fa-solid fa-building-columns" style="color:#fff"></i></div>
    <div>
      <div class="hdr-title">FPAM MDA Portal</div>
      <div class="hdr-sub">Compliance & Certification Requests</div>
    </div>
  </div>
  <div class="hdr-right">
    <div class="hdr-mda" id="hdr-mda-name">—</div>
    <button class="logout-btn" onclick="doLogout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
  </div>
</header>

<div class="wrap">
  <div class="page-hd">
    <div>
      <h1>My Requests</h1>
      <p>Forms submitted to FPAM on behalf of your MDA</p>
    </div>
    <button class="btn btn-primary" onclick="openNewRequestPicker()"><i class="fa-solid fa-plus"></i> New Request</button>
  </div>

  <div class="stat-row" id="stat-row"></div>

  <div class="card" id="requests-list">
    <div style="text-align:center;padding:50px"><div class="spinner"></div></div>
  </div>
</div>

<!-- FORM TYPE PICKER -->
<div class="modal-overlay" id="picker-modal">
  <div class="modal-box" style="width:640px">
    <div class="modal-hd"><h3>Select a Form to Submit</h3><button class="close-x" onclick="closeModal('picker-modal')"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="modal-body">
      <div class="form-type-grid" id="form-type-grid"></div>
    </div>
  </div>
</div>

<!-- NEW REQUEST FORM -->
<div class="modal-overlay" id="new-request-modal">
  <div class="modal-box">
    <div class="modal-hd"><h3 id="nr-title">New Request</h3><button class="close-x" onclick="closeModal('new-request-modal')"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="modal-body"><div class="ff-form-grid" id="nr-fields"></div></div>
    <div class="modal-ft">
      <button class="btn btn-ghost" onclick="closeModal('new-request-modal')">Cancel</button>
      <button class="btn btn-secondary" onclick="submitNewRequest('Draft')">Save Draft</button>
      <button class="btn btn-primary" onclick="submitNewRequest('Submitted')"><i class="fa-solid fa-paper-plane"></i> Submit to FPAM</button>
    </div>
  </div>
</div>

<!-- VIEW REQUEST -->
<div class="modal-overlay" id="view-request-modal">
  <div class="modal-box">
    <div class="modal-hd"><h3 id="vr-title">Request Detail</h3><button class="close-x" onclick="closeModal('view-request-modal')"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="modal-body" id="vr-body"></div>
    <div class="modal-ft" id="vr-footer"></div>
  </div>
</div>

<script src="js/form_field_defs.js"></script>
<script src="js/form_renderer.js"></script>
<script src="js/api.js"></script>
<script src="js/mda_portal.js"></script>
</body>
</html>
